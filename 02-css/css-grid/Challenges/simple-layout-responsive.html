<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Grid</title>

<style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.container{
    display: grid;
    gap: 10px;
    padding: 10px;
}

/* Default (mobile first) → 1 column */
.container{
    grid-template-columns: 1fr;
    grid-auto-rows: 120px;
}

/* Items */
.item{
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 20px;
    font-weight: bold;
    border: 2px solid black;
}

/* Base colors */
.i1{ background: red; }
.i2{ background: steelblue; }
.i3{ background: cyan; }
.i4{ background: lightgreen; }
.i5{ background: orange; }
.i6{ background: red; }
.i7{ background: cyan; }
.i8{ background: steelblue; }

/* Tablet (2 columns) */
@media (min-width: 600px){
    .container{
        grid-template-columns: repeat(2, 1fr);
    }
}

/* Desktop (4 columns + your layout logic) */
@media (min-width: 992px){
    .container{
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(3, 150px);
    }

    .i1{
        grid-column: 1;
        grid-row: 1/3;
    }

    .i2{
        grid-column: 2/4;
        grid-row: 1;
    }

    .i6{
        grid-column: 4;
        grid-row: 2/4;
    }

    .i8{
        grid-column: 2/4;
        grid-row: 3;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="item i1">1</div>
    <div class="item i2">2</div>
    <div class="item i3">3</div>
    <div class="item i4">4</div>
    <div class="item i5">5</div>
    <div class="item i6">6</div>
    <div class="item i7">7</div>
    <div class="item i8">8</div>
</div>

</body>
</html>
