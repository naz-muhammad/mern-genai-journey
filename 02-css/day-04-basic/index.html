<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic - CSS </title>
    <style>
        .font{
            font-size: 24px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: 800;
            font-style: oblique;

            background-color: red;
        }
        #font-h2{
            font-size: 34px;
            font-family: sans-serif;
            font-weight:100;
           font-style: italic;
           font-variant:small-caps;

           background-color: lightgray;
           
           
        }


    </style>
</head>
<body>

    <h1>BASIC - CSS</h1>

    <h2  id="font-h2">font</h2>
    <p class="font">I am font of the fisrt h2</p>


    
</body>
</html>
